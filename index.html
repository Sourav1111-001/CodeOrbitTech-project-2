<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tic<span>Tac</span>Toe</h1>

    <div class="difficulty">
      <button class="diff-btn" data-d="easy">Easy</button>
      <button class="diff-btn active" data-d="hard">Hard</button>
    </div>

    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">YOU (X)</span>
        <span class="score-val" id="score-x">0</span>
      </div>
      <div class="score-box draw-box">
        <span class="score-label">DRAW</span>
        <span class="score-val" id="score-d">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">AI (O)</span>
        <span class="score-val" id="score-o">0</span>
      </div>
    </div>

    <p id="status"><span id="status-icon">🎮</span> <span id="status-text">Your turn</span></p>

    <div class="board-wrap">
      <div id="board">
        <div class="cell" data-i="0"></div>
        <div class="cell" data-i="1"></div>
        <div class="cell" data-i="2"></div>
        <div class="cell" data-i="3"></div>
        <div class="cell" data-i="4"></div>
        <div class="cell" data-i="5"></div>
        <div class="cell" data-i="6"></div>
        <div class="cell" data-i="7"></div>
        <div class="cell" data-i="8"></div>
      </div>
      <svg id="win-line" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
        <line id="win-stroke" x1="0" y1="0" x2="0" y2="0"/>
      </svg>
    </div>

    <div class="actions">
      <button id="restart">New Game</button>
      <button id="reset-score">Reset Score</button>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="overlay-content">
      <div id="overlay-emoji"></div>
      <div id="overlay-msg"></div>
      <button id="overlay-btn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
